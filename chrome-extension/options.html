<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; color: #1E241F; }
  h1 { font-size: 18px; }
  p { color: #6B7268; font-size: 14px; line-height: 1.6; }
  textarea {
    width: 100%; height: 70px; padding: 10px; border: 1px solid #DADCD5;
    border-radius: 6px; font-family: monospace; font-size: 12px; box-sizing: border-box;
  }
  button {
    margin-top: 10px; padding: 9px 16px; border: none; border-radius: 6px;
    background: #1F6F63; color: #F5F6F3; font-weight: 500; cursor: pointer;
  }
  #status { font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Conectar ao Link Saver</h1>
  <p>
    Abra o web app, faça login com o link mágico e copie o "token de sincronização"
    que aparece no painel "Conectar a extensão do Chrome". Cole abaixo.
  </p>
  <textarea id="token-input" placeholder="Cole o token aqui"></textarea>
  <button id="save-btn">Salvar</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
