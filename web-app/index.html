<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>h3aven</title>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/favicon-180.png" />
<meta name="theme-color" content="#101216" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="login-view" class="screen">
  <div class="login-box">
    <h1>h3aven</h1>
    <p class="muted">Sua biblioteca pessoal, sincronizada com a extensão.</p>
    <form id="login-form">
      <input type="email" id="email-input" placeholder="seu@email.com" required autocomplete="email" />
      <button type="submit">Enviar link mágico</button>
    </form>
    <p id="login-status" class="muted small"></p>
  </div>
</div>

<div id="app-view" class="screen hidden">
  <header class="app-header">
    <div class="app-header-blur" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="app-header-tint" aria-hidden="true"></div>
    <div class="app-header-content">
      <div class="app-header-left">
        <div class="app-header-brand">
          <img src="icons/favicon-48.png" alt="h3aven" />
        </div>
        <nav class="app-nav">
          <a href="#/" class="nav-link" data-view="home">Home</a>
          <a href="#/biblioteca" class="nav-link" data-view="biblioteca">Biblioteca</a>
          <a href="#/colecoes" class="nav-link" data-view="colecoes">Coleções</a>
        </nav>
      </div>
      <button type="button" id="header-search-btn" class="header-search-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Buscar</span>
      </button>
      <div class="header-actions">
        <div class="create-wrap">
        <button type="button" id="create-btn" class="create-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Criar</span>
        </button>
        <div id="create-menu" class="create-menu hidden">
          <button type="button" class="create-menu-item" data-action="collection">
            <span class="create-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </span>
            <span class="create-menu-text"><strong>Nova coleção</strong><small>Organize conteúdos por contexto</small></span>
          </button>
          <button type="button" class="create-menu-item" data-action="media">
            <span class="create-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4M16 5v4"/></svg>
            </span>
            <span class="create-menu-text"><strong>Filme ou série</strong><small>Buscar e adicionar à biblioteca</small></span>
          </button>
          <button type="button" class="create-menu-item" data-action="music">
            <span class="create-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            </span>
            <span class="create-menu-text"><strong>Música</strong><small>Colar um link do Spotify</small></span>
          </button>
          <button type="button" class="create-menu-item" data-action="import">
            <span class="create-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </span>
            <span class="create-menu-text"><strong>Importar lista</strong><small>Colar links e tags de uma planilha</small></span>
          </button>
          <button type="button" class="create-menu-item" data-action="extension">
            <span class="create-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M5.6 8.5l5.2 3M18.4 8.5l-5.2 3"/></svg>
            </span>
            <span class="create-menu-text"><strong>Extensão do Chrome</strong><small>Salvar links de qualquer lugar</small></span>
          </button>
        </div>
      </div>
      <div class="avatar-wrap">
        <button id="avatar-btn" class="avatar-btn" aria-label="Conta">
          <span id="avatar-initial" class="avatar-circle"></span>
          <svg class="avatar-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="avatar-menu" class="avatar-menu hidden">
          <span id="user-email" class="muted small"></span>
          <div class="avatar-menu-divider"></div>
          <button type="button" class="avatar-menu-item" disabled>Configurações</button>
          <div class="avatar-menu-row">
            <span class="small muted">Tema</span>
            <div class="segmented" id="theme-toggle">
              <button type="button" data-theme="light" aria-label="Claro">☀</button>
              <button type="button" data-theme="dark" class="active" aria-label="Escuro">☾</button>
              <button type="button" data-theme="auto" aria-label="Automático">◐</button>
            </div>
          </div>
          <div class="avatar-menu-row">
            <span class="small muted">Densidade</span>
            <div class="segmented" id="density-toggle">
              <button type="button" data-density="compact">▤</button>
              <button type="button" data-density="medium" class="active">▦</button>
              <button type="button" data-density="wide">▥</button>
            </div>
          </div>
          <div class="avatar-menu-divider"></div>
          <button id="logout-btn" class="avatar-menu-item">Sair</button>
        </div>
      </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="hero" class="hero">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="video/hero-sky.mp4" type="video/mp4" />
      </video>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p id="hero-greeting" class="hero-greeting"></p>
        <form class="hero-search-bar" id="hero-search-form">
          <input type="search" id="search-input" placeholder="Buscar item salvo" autocomplete="off" />
          <button type="submit">Buscar</button>
          <div id="search-suggestions" class="search-suggestions hidden"></div>
        </form>
        <div class="type-picker hero-pills" id="home-pills">
          <button type="button" class="filter-pill active" data-filter="">Tudo</button>
          <button type="button" class="filter-pill" data-filter="youtube">Youtube</button>
          <button type="button" class="filter-pill" data-filter="link">Links</button>
          <button type="button" class="filter-pill" data-filter="shopping">Shopping</button>
          <button type="button" class="filter-pill" data-filter="instagram">Instagram</button>
          <button type="button" class="filter-pill" data-filter="tweet">Twitter</button>
          <button type="button" class="filter-pill" data-filter="livros">Livros</button>
          <button type="button" class="filter-pill" data-filter="watch-later">Watch Later</button>
        </div>
      </div>
    </section>

    <div id="collections-grid" class="collections-grid hidden"></div>

    <div id="collection-back-bar" class="collection-back-bar hidden">
      <button type="button" id="collection-back-btn" class="ghost small-btn">← Coleções</button>
      <h2 id="collection-view-title"></h2>
    </div>

    <ul id="link-list" class="library-grid layout-masonry"></ul>
    <p id="empty-state" class="muted hidden">Nenhum item salvo ainda.</p>
  </main>

  <div class="toast-stack">
    <div id="ext-promo-toast" class="toast ext-promo-toast hidden">
      <button type="button" id="ext-promo-close" class="toast-close" aria-label="Fechar">&times;</button>
      <div class="ext-promo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="4" cy="4" r="2.4"/><circle cx="12" cy="4" r="2.4"/><circle cx="20" cy="4" r="2.4"/><circle cx="4" cy="12" r="2.4"/><circle cx="20" cy="12" r="2.4"/><circle cx="4" cy="20" r="2.4"/><circle cx="12" cy="20" r="2.4"/><circle cx="20" cy="20" r="2.4"/></svg>
      </div>
      <div class="ext-promo-body">
        <p class="ext-promo-title">Salve no h3aven</p>
        <p class="ext-promo-subtitle">de qualquer lugar da web</p>
        <button type="button" id="ext-promo-btn" class="ext-promo-btn">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#fff"/><path fill="#EA4335" d="M12 6.5h9a12 12 0 0 0-16.5-3l4.5 7.8A5.9 5.9 0 0 1 12 6.5Z"/><path fill="#34A853" d="M6 12a5.9 5.9 0 0 1 2.3-4.7L3.8 3.4A12 12 0 0 0 .9 15.6l4.9-2.8A5.9 5.9 0 0 1 6 12Z"/><path fill="#4285F4" d="M12 17.9a5.9 5.9 0 0 1-5.2-3.1l-4.9 2.8A12 12 0 0 0 12 24a11.9 11.9 0 0 0 10.3-6l-5.2-3a5.9 5.9 0 0 1-5.1 2.9Z"/><path fill="#FBBC05" d="M23.6 9.5H12v5h6.6a6 6 0 0 1-2.5 3.4l5.2 3A12 12 0 0 0 24 12a12 12 0 0 0-.4-2.5Z"/></svg>
          Instalar a extensão
        </button>
      </div>
    </div>

    <div id="progress-toast" class="toast progress-toast hidden">
      <button type="button" id="progress-close" class="toast-close" aria-label="Fechar">&times;</button>
      <div class="progress-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      </div>
      <p class="progress-title">Monte sua biblioteca</p>
      <p class="progress-count"><span id="progress-count-current">0</span> de <span id="progress-count-goal">5</span> salvos</p>
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>
</div>

<div id="create-modal-overlay" class="quickview-overlay hidden">
  <div class="create-modal" role="dialog" aria-modal="true">
    <button type="button" id="create-modal-close" class="quickview-close" aria-label="Fechar">&times;</button>
    <div id="create-modal-body"></div>
  </div>
</div>

<div id="collection-picker-overlay" class="collection-picker-overlay hidden">
  <div class="collection-picker" role="dialog" aria-modal="true">
    <div id="collection-picker-list" class="collection-picker-list"></div>
    <form id="collection-picker-new-form" class="collection-picker-new-form">
      <input type="text" id="collection-picker-new-input" placeholder="Nova coleção..." autocomplete="off" />
      <button type="submit" class="small-btn">Criar</button>
    </form>
  </div>
</div>

<div id="quickview-overlay" class="quickview-overlay hidden">
  <div class="quickview" role="dialog" aria-modal="true">
    <button id="quickview-close" class="quickview-close" aria-label="Fechar">&times;</button>
    <div class="quickview-media">
      <img id="quickview-img" alt="" />
      <a id="quickview-open-link" class="quickview-open-btn" target="_blank" rel="noopener noreferrer">Abrir original ↗</a>
    </div>
    <div class="quickview-info">
      <h2 id="quickview-title"></h2>
      <div class="quickview-meta">
        <span id="quickview-domain" class="muted small"></span>
        <span id="quickview-time" class="muted small"></span>
      </div>
      <div class="quickview-section" id="quickview-subtitle-row"></div>
      <div class="quickview-section">
        <h3>TLDR</h3>
        <p id="quickview-description" class="muted small"></p>
      </div>
      <div class="quickview-section">
        <h3>Tags</h3>
        <div id="quickview-tags" class="quickview-tags"></div>
        <form id="quickview-add-tag-form">
          <input id="quickview-tag-input" placeholder="Adicionar tag" autocomplete="off" />
        </form>
      </div>
      <div class="quickview-section">
        <h3>Notas</h3>
        <textarea id="quickview-notes" placeholder="Escreva algo sobre esse item..."></textarea>
      </div>
      <div class="quickview-actions">
        <button id="quickview-copy-btn" type="button" class="ghost small-btn">Copiar link</button>
        <button id="quickview-delete-btn" type="button" class="ghost small-btn danger-btn">Remover</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
